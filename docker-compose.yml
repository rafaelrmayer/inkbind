services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkbind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkbind_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-inkbind}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-inkbind}:${POSTGRES_PASSWORD:-inkbind_dev_only}@postgres:5432/${POSTGRES_DB:-inkbind}
      STORAGE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-inkbind}:${POSTGRES_PASSWORD:-inkbind_dev_only}@postgres:5432/${POSTGRES_DB:-inkbind}
      STORAGE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
  redis_data:
  storage_data:
